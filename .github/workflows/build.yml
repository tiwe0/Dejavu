name: Build Dejavu

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-host:
    name: Build and Test (Host)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3
      
      - name: Run host smoke tests
        run: |
          make host-smoke
      
      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-smoke-logs
          path: out/host-smoke/

  build-android:
    name: Build Android arm64 (API 26 baseline)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: 26
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
      
      - name: Set ANDROID_NDK_HOME
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3
      
      - name: Build Android arm64 binary
        run: |
          make android-arm64
      
      - name: Verify build output
        run: |
          ls -lh out/android-arm64-v8a-api26/
          file out/android-arm64-v8a-api26/libdejavu.so
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-api26-build
          path: out/android-arm64-v8a-api26/

  build-android-compat:
    name: Compatibility Build (API ${{ matrix.android_api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android_api: [30, 34, 35]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3

      - name: Build compatibility target
        env:
          ANDROID_API: ${{ matrix.android_api }}
        run: |
          make android-arm64
          make -C zygisk build

      - name: Verify compatibility output
        env:
          ANDROID_API: ${{ matrix.android_api }}
        run: |
          file "out/android-arm64-v8a-api${ANDROID_API}/libdejavu.so"
          file "zygisk/out/lsplant-android-arm64-v8a-api${ANDROID_API}/libdejavu_zygisk.so"
          file "zygisk/out/lsplant-android-arm64-v8a-api${ANDROID_API}/libdejavu_agent.so"

  build-zygisk-module:
    name: Build Zygisk Module (API 26 baseline)
    runs-on: ubuntu-latest
    needs: build-android
    env:
      ANDROID_API: 26
    outputs:
      artifact_name: ${{ steps.package-meta.outputs.artifact_name }}
      package_glob: ${{ steps.package-meta.outputs.package_glob }}
      package_filename: ${{ steps.package-meta.outputs.package_filename }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true
      
      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3

      - name: Derive package metadata
        id: package-meta
        run: |
          default_version=$(sed -n "s/^version=//p" zygisk/module/module.prop | head -n 1)
          if [[ -z "${default_version}" ]]; then
            echo "error: missing version= entry in zygisk/module/module.prop" >&2
            exit 1
          fi
          module_version=${default_version#v}
          module_version_tag=v${module_version}
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${module_version_tag}" ]]; then
              echo "error: tag ${GITHUB_REF_NAME} does not match zygisk/module/module.prop version ${default_version}" >&2
              exit 1
            fi
          fi

          echo "package_version=${module_version}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=dejavu-zygisk-arm64-v${module_version}" >> "$GITHUB_OUTPUT"
          echo "package_glob=zygisk/dist/dejavu-zygisk-v${module_version}-arm64.zip" >> "$GITHUB_OUTPUT"
          echo "package_filename=dejavu-zygisk-v${module_version}-arm64.zip" >> "$GITHUB_OUTPUT"
      
      - name: Build core first
        run: make android-arm64
      
      - name: Run Zygisk host tests
        run: make -C zygisk test
      
      - name: Package Zygisk module
        env:
          PACKAGE_VERSION: ${{ steps.package-meta.outputs.package_version }}
        run: make -C zygisk package
      
      - name: Verify module package
        run: |
          ls -lh zygisk/dist/
          unzip -l ${{ steps.package-meta.outputs.package_glob }}
      
      - name: Upload Zygisk module
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-meta.outputs.artifact_name }}
          path: ${{ steps.package-meta.outputs.package_glob }}

  release-zygisk-module:
    name: Release Zygisk Module
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [build-zygisk-module, build-android-compat]
    permissions:
      contents: write

    steps:
      - name: Download packaged module
        uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ needs.build-zygisk-module.outputs.artifact_name }}
          path: release-assets

      - name: Verify release asset
        run: |
          ls -lh release-assets/
          unzip -l release-assets/${{ needs.build-zygisk-module.outputs.package_filename }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/${{ needs.build-zygisk-module.outputs.package_filename }}
          generate_release_notes: true

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      
      - name: Check C code formatting
        run: |
          find src zygisk/src zygisk/include -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) | while read file; do
            echo "Checking $file..."
            clang-format --dry-run "$file"
          done
      
      - name: Check for issues
        run: |
          echo "=== Checking for TODO/FIXME comments ==="
          grep -r "TODO\|FIXME" src/ zygisk/src/ || echo "None found"

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-host, build-android, build-android-compat, build-zygisk-module, code-quality]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "=== Build Summary ==="
          echo "Host tests: ${{ needs.build-host.result }}"
          echo "Android build: ${{ needs.build-android.result }}"
          echo "Compatibility builds: ${{ needs.build-android-compat.result }}"
          echo "Zygisk module: ${{ needs.build-zygisk-module.result }}"
          echo "Code quality: ${{ needs.code-quality.result }}"
          
          if [ "${{ needs.build-host.result }}" != "success" ] || \
             [ "${{ needs.build-android.result }}" != "success" ] || \
             [ "${{ needs.build-android-compat.result }}" != "success" ] || \
             [ "${{ needs.build-zygisk-module.result }}" != "success" ]; then
            echo "❌ Build failed!"
            exit 1
          fi
          echo "✅ All builds passed!"
