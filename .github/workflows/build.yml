name: Build Dejavu

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-host:
    name: Build and Test (Host)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Initialize public dependencies
        run: git submodule update --init --recursive -- extern/lua extern/tinycc
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3
      
      - name: Run host smoke tests
        run: |
          make host-smoke

      - name: Test host stream receiver
        run: make stream-test
      
      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-smoke-logs
          path: out/host-smoke/

  build-android:
    name: Build Android arm64 (API 26 baseline)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: 26
    
    steps:
      - uses: actions/checkout@v4

      - name: Initialize public dependencies
        run: git submodule update --init --recursive -- extern/lua extern/tinycc
      
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r29
          add-to-path: true
      
      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3
      
      - name: Build Android arm64 binary
        run: |
          make android-arm64
      
      - name: Verify build output
        run: |
          ls -lh out/android-arm64-v8a-api26/
          file out/android-arm64-v8a-api26/libdejavu.so
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-api26-build
          path: out/android-arm64-v8a-api26/

  build-android-compat:
    name: Compatibility Build (API ${{ matrix.android_api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android_api: [30, 34, 35]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize public dependencies
        run: git submodule update --init --recursive -- extern/lua extern/tinycc

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r29
          add-to-path: true

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3

      - name: Build compatibility target
        env:
          ANDROID_API: ${{ matrix.android_api }}
        run: |
          make android-arm64
          make -C zygisk build

      - name: Verify compatibility output
        env:
          ANDROID_API: ${{ matrix.android_api }}
        run: |
          file "out/android-arm64-v8a-api${ANDROID_API}/libdejavu.so"
          file "zygisk/out/lsplant-android-arm64-v8a-api${ANDROID_API}/libdejavu_zygisk.so"
          file "zygisk/out/lsplant-android-arm64-v8a-api${ANDROID_API}/libdejavu_agent.so"

  version-check:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare module.prop version with previous commit
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version=//p' zygisk/module/module.prop | head -n 1)
          if [[ -z "${current}" ]]; then
            echo "error: missing version= entry in zygisk/module/module.prop" >&2
            exit 1
          fi
          current=${current#v}
          changed=false
          if [[ "${EVENT_NAME}" == "push" && "${REF_TYPE}" == "branch" &&
                -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            if git cat-file -e "${BEFORE_SHA}:zygisk/module/module.prop" 2>/dev/null; then
              previous=$(git show "${BEFORE_SHA}:zygisk/module/module.prop" | sed -n 's/^version=//p' | head -n 1)
              previous=${previous#v}
              if [[ -n "${previous}" && "${previous}" != "${current}" ]]; then
                changed=true
              fi
            fi
          fi
          {
            echo "changed=${changed}"
            echo "version=${current}"
            echo "tag=v${current}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${current} changed=${changed}"

  build-zygisk-module:
    name: Build Zygisk Module (API 26 baseline)
    runs-on: ubuntu-latest
    needs: build-android
    env:
      ANDROID_API: 26
    outputs:
      package_version: ${{ steps.package-meta.outputs.package_version }}
      artifact_name: ${{ steps.package-meta.outputs.artifact_name }}
      package_glob: ${{ steps.package-meta.outputs.package_glob }}
      package_filename: ${{ steps.package-meta.outputs.package_filename }}
      plugins_filename: ${{ steps.plugins-package.outputs.filename }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Initialize public dependencies
        run: git submodule update --init --recursive -- extern/lua extern/tinycc
      
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r29
          add-to-path: true
      
      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3

      - name: Derive package metadata
        id: package-meta
        run: |
          default_version=$(sed -n "s/^version=//p" zygisk/module/module.prop | head -n 1)
          if [[ -z "${default_version}" ]]; then
            echo "error: missing version= entry in zygisk/module/module.prop" >&2
            exit 1
          fi
          module_version=${default_version#v}
          module_version_tag=v${module_version}
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${module_version_tag}" ]]; then
              echo "error: tag ${GITHUB_REF_NAME} does not match zygisk/module/module.prop version ${default_version}" >&2
              exit 1
            fi
          fi

          {
            echo "package_version=${module_version}"
            echo "artifact_name=dejavu-zygisk-arm64-v${module_version}"
            echo "package_glob=zygisk/dist/dejavu-zygisk-v${module_version}-arm64.zip"
            echo "package_filename=dejavu-zygisk-v${module_version}-arm64.zip"
          } >> "$GITHUB_OUTPUT"
      
      - name: Build core first
        run: make android-arm64
      
      - name: Run Zygisk host tests
        run: make -C zygisk test
      
      - name: Package Zygisk module
        env:
          PACKAGE_VERSION: ${{ steps.package-meta.outputs.package_version }}
        run: make -C zygisk package
      
      - name: Verify module package
        run: |
          ls -lh zygisk/dist/
          unzip -l ${{ steps.package-meta.outputs.package_glob }}
      
      - name: Build example plugins
        run: |
          ./examples/hello/build.sh
          ./examples/capture/build.sh
          ./examples/algorithm/build.sh
          ./examples/unpack/build.sh

      - name: Package example plugins
        id: plugins-package
        env:
          PACKAGE_VERSION: ${{ steps.package-meta.outputs.package_version }}
        run: |
          ./examples/package.sh
          echo "filename=dejavu-plugins-v${PACKAGE_VERSION}-arm64.zip" >> "$GITHUB_OUTPUT"

      - name: Upload example plugins
        uses: actions/upload-artifact@v4
        with:
          name: dejavu-example-plugins
          path: out/plugins/dejavu-plugins-*.zip

      - name: Upload Zygisk module
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-meta.outputs.artifact_name }}
          path: ${{ steps.package-meta.outputs.package_glob }}

  release-zygisk-module:
    name: Release Zygisk Module
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref_type == 'tag') ||
        (github.event_name == 'push' && github.ref_type == 'branch' &&
         github.ref == 'refs/heads/main' &&
         needs.version-check.outputs.changed == 'true')
      }}
    runs-on: ubuntu-latest
    needs: [version-check, build-host, build-android, build-android-compat, build-zygisk-module, code-quality]
    permissions:
      contents: write

    steps:
      - name: Derive release metadata
        id: release-meta
        env:
          PACKAGE_VERSION: ${{ needs.build-zygisk-module.outputs.package_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            release_name="Dejavu ${GITHUB_REF_NAME}"
            prerelease=false
            make_latest=true
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            release_tag="v${PACKAGE_VERSION}"
            release_name="Dejavu v${PACKAGE_VERSION}"
            prerelease=false
            make_latest=true
          else
            short_sha="${GITHUB_SHA:0:7}"
            release_tag="v${PACKAGE_VERSION}-build.${GITHUB_RUN_NUMBER}"
            release_name="Dejavu v${PACKAGE_VERSION} build ${GITHUB_RUN_NUMBER} (${short_sha})"
            prerelease=true
            make_latest=false
          fi

          {
            echo "release_tag=${release_tag}"
            echo "release_name=${release_name}"
            echo "prerelease=${prerelease}"
            echo "make_latest=${make_latest}"
          } >> "$GITHUB_OUTPUT"

      - name: Download packaged module
        uses: actions/download-artifact@v4.1.3
        with:
          name: ${{ needs.build-zygisk-module.outputs.artifact_name }}
          path: release-assets

      - name: Download example plugins
        uses: actions/download-artifact@v4.1.3
        with:
          name: dejavu-example-plugins
          path: release-assets/plugins

      - name: Verify release assets
        run: |
          ls -lh release-assets/ release-assets/plugins/
          unzip -l release-assets/${{ needs.build-zygisk-module.outputs.package_filename }}
          unzip -l release-assets/plugins/${{ needs.build-zygisk-module.outputs.plugins_filename }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release-meta.outputs.release_tag }}
          name: ${{ steps.release-meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release-meta.outputs.prerelease }}
          make_latest: ${{ steps.release-meta.outputs.make_latest }}
          files: |
            release-assets/${{ needs.build-zygisk-module.outputs.package_filename }}
            release-assets/plugins/${{ needs.build-zygisk-module.outputs.plugins_filename }}
          fail_on_unmatched_files: true
          generate_release_notes: true

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          python3 -m venv /tmp/clang-format-venv
          /tmp/clang-format-venv/bin/pip install --disable-pip-version-check clang-format==18.1.8
          echo "/tmp/clang-format-venv/bin" >> "$GITHUB_PATH"

      - name: Check C/C++ formatting (changed files)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_REF}" ]]; then
            git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            range="origin/${BASE_REF}...HEAD"
          elif [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            range="${BEFORE_SHA}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "Checking formatting for ${range}"
          changed=$(git diff --name-only --diff-filter=ACMR "${range}" -- \
            src include tests zygisk/src zygisk/include zygisk/tests plugins |
            grep -E '\.(c|cpp|h)$' || true)
          if [[ -z "${changed}" ]]; then
            echo "No C/C++ changes to check."
            exit 0
          fi
          status=0
          while IFS= read -r file; do
            [[ -f "${file}" ]] || continue
            echo "Checking ${file}..."
            clang-format --dry-run --Werror "${file}" || status=1
          done <<< "${changed}"
          exit "${status}"

      - name: Check shell script syntax
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "${script}"
          done < <(find . -path ./extern -prune -o -path ./zygisk/third_party -prune \
            -o -name '*.sh' -type f -print)
          python3 -m py_compile dejavu dejavu_mcp.py tests/mcp_server_test.py zygisk/scripts/dejavuctl examples/unpack/cli.py

      - name: Check for TODO/FIXME comments
        run: |
          if grep -rn "TODO\|FIXME" src/ zygisk/src/ zygisk/include/; then
            echo "error: remove TODO/FIXME markers before merging" >&2
            exit 1
          fi
          echo "No TODO/FIXME markers found."

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [version-check, build-host, build-android, build-android-compat, build-zygisk-module, code-quality]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "=== Build Summary ==="
          echo "Host tests: ${{ needs.build-host.result }}"
          echo "Android build: ${{ needs.build-android.result }}"
          echo "Compatibility builds: ${{ needs.build-android-compat.result }}"
          echo "Zygisk module: ${{ needs.build-zygisk-module.result }}"
          echo "Code quality: ${{ needs.code-quality.result }}"
          
          if [ "${{ needs.build-host.result }}" != "success" ] || \
             [ "${{ needs.build-android.result }}" != "success" ] || \
             [ "${{ needs.build-android-compat.result }}" != "success" ] || \
             [ "${{ needs.build-zygisk-module.result }}" != "success" ] || \
             [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "❌ Build failed!"
            exit 1
          fi
          echo "✅ All builds passed!"
